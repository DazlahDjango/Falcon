# ============================================================================
# FALCON PMS - POSTGRESQL HOST-BASED AUTHENTICATION (pg_hba.conf)
# Security Firewall & Client Access Rules for Single/Multi-Tenant Production
# ============================================================================
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# ----------------------------------------------------------------------------
# 1. LOCAL UNIX SOCKET & LOCALHOST ACCESS (Local Dev & Admin Operations)
# ----------------------------------------------------------------------------
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust

# ----------------------------------------------------------------------------
# 2. DOCKER & APPLICATION SERVER SUBNET ACCESS (PgBouncer & Web Workers)
# Allows Django & PgBouncer instances on local network / Docker subnets to connect
# ----------------------------------------------------------------------------
host    all             postgres        172.16.0.0/12           scram-sha-256
host    all             postgres        10.0.0.0/8              scram-sha-256

# ----------------------------------------------------------------------------
# 3. STREAMING REPLICATION FOR READ REPLICAS
# Allows secondary replica DB instances to stream WAL data from primary DB
# ----------------------------------------------------------------------------
host    replication     postgres        127.0.0.1/32            trust
host    replication     replicator      172.16.0.0/12           scram-sha-256
host    replication     replicator      10.0.0.0/8              scram-sha-256