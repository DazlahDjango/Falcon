# ============================================================================
# FALCON PMS - NGINX LOAD BALANCER CONFIGURATION
# Local & Production Load Balancer for Multi-Instance Django Application Servers
# ============================================================================

worker_processes 4;  # Number of CPU cores

events {
    worker_connections 4096;
    multi_accept on;
    use select;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Logging
    access_log logs/access.log;
    error_log logs/error.log;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    upstream django_apps {
        # Load balancing - round robin across local app instances
        server 127.0.0.1:8000;
        server 127.0.0.1:8001;
        server 127.0.0.1:8002;
        
        # Keep alive connections between Nginx and Django app instances
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Static files (Wrapped in double quotes for path space safety)
        location /static/ {
            alias "C:/Users/Dazlah Administrator/Desktop/Forward/Falcon/static/";
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Media files (Wrapped in double quotes for path space safety)
        location /media/ {
            alias "C:/Users/Dazlah Administrator/Desktop/Forward/Falcon/media/";
            expires 7d;
        }

        # Django application endpoints
        location / {
            proxy_pass http://django_apps;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 75s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            
            # Buffering
            proxy_buffering off;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        # WebSocket support for Channels / Realtime
        location /ws/ {
            proxy_pass http://django_apps;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        # Health check probe
        location /health/ {
            proxy_pass http://django_apps;
            access_log off;
        }

        # Error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }
}
