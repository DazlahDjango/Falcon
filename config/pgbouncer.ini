# ============================================================================
# FALCON PMS - HIGH-CONCURRENCY PGBOUNCER CONFIGURATION
# Optimized for 50,000+ Active Users across 500+ Tenant Schemas
# ============================================================================

[databases]
# Forward connections for falcon database to local or remote PostgreSQL instance
# Use your actual database name from .env
fasc_db = host=172.22.96.1 port=5432 dbname=fasc_db
postgres = host=172.22.96.1 port=5432 dbname=postgres
* = host=172.22.96.1 port=5432

[pgbouncer]
# Network configuration
listen_port = 6432
listen_addr = *
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt

# Connection Pool Settings
# 'transaction' mode allows thousands of incoming HTTP client requests to share
# a small backend pool of real PostgreSQL connections.
pool_mode = transaction

# Maximum client connections PgBouncer will accept from Django app instances
max_client_conn = 10000

# Default backend pool size per (database, user) pair connected to PostgreSQL
default_pool_size = 150
min_pool_size = 25
reserve_pool_size = 50
reserve_pool_timeout = 3

# Connection Lifetime & Timeouts
server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 3
client_idle_timeout = 0
client_login_timeout = 60

# Transaction Reset Query (Clean up session state on release)
server_reset_query = DISCARD ALL
server_reset_query_always = 0

# Low-level socket settings
max_db_connections = 500
pkt_buf = 4096
listen_backlog = 512
ignore_startup_parameters = extra_float_digits, search_path, options, application_name
