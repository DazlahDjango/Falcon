# ============================================================================
# FALCON PMS - HIGH-CONCURRENCY POSTGRESQL TUNING GUIDE
# Optimized for 500+ Schemas, 50,000+ Concurrent Users (with PgBouncer)
# Target Hardware: Production Server (e.g. 16-32 vCPU, 32GB-64GB RAM)
# ============================================================================

# CONNECTIONS & PGBOUNCER
max_connections = 500                    # PgBouncer handles client multiplexing (up to 10,000 clients)
superuser_reserved_connections = 3

# MEMORY ALLOCATION (for ~64GB RAM System)
shared_buffers = 16GB                    # 25% of Total RAM
work_mem = 32MB                          # Memory per query operation
maintenance_work_mem = 2GB               # Memory for maintenance (VACUUM, INDEX)
effective_cache_size = 48GB              # 75% of Total RAM

# WRITE AHEAD LOG (WAL) & CHECKPOINTS
wal_level = replica
max_wal_size = 16GB
min_wal_size = 2GB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
wal_buffers = 64MB

# WORKER THREADS & PARALLELISM
max_worker_processes = 16
max_parallel_workers_per_gather = 4
max_parallel_workers = 16
max_parallel_maintenance_workers = 4

# QUERY OPTIMIZER & STATISTICS
random_page_cost = 1.1                   # Optimized for SSD / NVMe Storage
effective_io_concurrency = 200
default_statistics_target = 500

# MULTI-TENANT SCHEMA & LOCK MANAGEMENT
max_locks_per_transaction = 128          # Increased for 500+ active schemas & RLS policies
max_pred_locks_per_transaction = 64

# LOGGING & MONITORING
log_destination = 'csvlog'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_min_duration_statement = 500         # Log slow queries taking > 500ms
log_line_prefix = '%m [%p] %q%u@%d '
