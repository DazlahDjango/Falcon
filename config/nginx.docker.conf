# ============================================================================
# FALCON PMS - NGINX DOCKER LOAD BALANCER CONFIGURATION
# Load Balancer for Multi-Instance Containerized Application Servers
# ============================================================================

worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    upstream django_apps {
        # Round-robin load balancing across Docker app containers
        server app-1:8000 max_fails=3 fail_timeout=10s;
        server app-2:8000 max_fails=3 fail_timeout=10s;
        
        # Keep alive connections between Nginx and Django app instances
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Static files from volume
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Media files from volume
        location /media/ {
            alias /app/media/;
            expires 7d;
        }

        # Django application endpoints
        location / {
            proxy_pass http://django_apps;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout 75s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            
            # Buffering
            proxy_buffering off;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        # WebSocket support for Channels / Realtime
        location /ws/ {
            proxy_pass http://django_apps;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        # Health check probe
        location /health/ {
            proxy_pass http://django_apps;
            access_log off;
        }
    }
}
