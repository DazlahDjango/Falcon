version: '3.8'

services:
  # --------------------------------------------------------------------------
  # Production Nginx Reverse Proxy & Load Balancer
  # --------------------------------------------------------------------------
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: falcon-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - falcon-static-vol:/app/staticfiles
      - falcon-media-vol:/app/media
    depends_on:
      - app-1
      - app-2
    networks:
      - falcon-prod-net

  # --------------------------------------------------------------------------
  # Production Application Node 1 (Daphne ASGI)
  # --------------------------------------------------------------------------
  app-1:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: falcon-app-1-prod
    restart: always
    expose:
      - "8000"
    environment:
      - DJANGO_ENV=production
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DB_HOST=pgbouncer
      - DB_DIRECT_PORT=5432
      - DB_PORT=6432
      - DB_NAME=postgres
      - DB_USER=postgress
      - DB_PASSWORD=${DB_PASSWORD:-postgress}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-prod-secret-django-key}
    volumes:
      - falcon-static-vol:/app/staticfiles
      - falcon-media-vol:/app/media
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - falcon-prod-net

  # --------------------------------------------------------------------------
  # Production Application Node 2 (Daphne ASGI)
  # --------------------------------------------------------------------------
  app-2:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: falcon-app-2-prod
    restart: always
    expose:
      - "8000"
    environment:
      - DJANGO_ENV=production
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DB_HOST=pgbouncer
      - DB_DIRECT_PORT=5432
      - DB_PORT=6432
      - DB_NAME=postgres
      - DB_USER=postgress
      - DB_PASSWORD=${DB_PASSWORD:-postgress}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-prod-secret-django-key}
    volumes:
      - falcon-static-vol:/app/staticfiles
      - falcon-media-vol:/app/media
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - falcon-prod-net

  # --------------------------------------------------------------------------
  # Production Celery Task Worker
  # --------------------------------------------------------------------------
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: falcon-celery-worker-prod
    restart: always
    command: ["celery", "-A", "config", "worker", "--loglevel=info"]
    environment:
      - DJANGO_ENV=production
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DB_HOST=pgbouncer
      - DB_DIRECT_PORT=5432
      - DB_PORT=6432
      - DB_NAME=postgres
      - DB_USER=postgress
      - DB_PASSWORD=${DB_PASSWORD:-postgress}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-prod-secret-django-key}
    depends_on:
      - app-1
    networks:
      - falcon-prod-net

  # --------------------------------------------------------------------------
  # Production Celery Beat Scheduler
  # --------------------------------------------------------------------------
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: falcon-celery-beat-prod
    restart: always
    command: ["celery", "-A", "config", "beat", "--loglevel=info"]
    environment:
      - DJANGO_ENV=production
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DB_HOST=pgbouncer
      - DB_DIRECT_PORT=5432
      - DB_PORT=6432
      - DB_NAME=postgres
      - DB_USER=postgress
      - DB_PASSWORD=${DB_PASSWORD:-postgress}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-prod-secret-django-key}
    depends_on:
      - app-1
    networks:
      - falcon-prod-net

  # --------------------------------------------------------------------------
  # Production PgBouncer Pooler
  # --------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: falcon-pgbouncer-prod
    restart: always
    expose:
      - "6432"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgress
      - DB_PASSWORD=${DB_PASSWORD:-postgress}
      - DB_NAME=postgres
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=10000
      - DEFAULT_POOL_SIZE=150
    volumes:
      - ./config/pgbouncer.docker.ini:/etc/pgbouncer/pgbouncer.ini
      - ./config/userlist.txt:/etc/pgbouncer/userlist.txt
    depends_on:
      db:
        condition: service_healthy
    networks:
      - falcon-prod-net

  # --------------------------------------------------------------------------
  # Production Primary Database Engine (PostgreSQL 16)
  # --------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: falcon-postgres-prod
    restart: always
    volumes:
      - falcon-db-data:/var/lib/postgresql/data
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./config/pg_hba.conf:/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgress
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgress}
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgress -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - falcon-prod-net

  # --------------------------------------------------------------------------
  # Production Redis Cache
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: falcon-redis-prod
    restart: always
    volumes:
      - falcon-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - falcon-prod-net

volumes:
  falcon-static-vol:
  falcon-media-vol:
  falcon-db-data:
  falcon-redis-data:

networks:
  falcon-prod-net:
    driver: bridge
