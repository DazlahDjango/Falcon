# Falcon PMS — SPA + API reverse proxy (used inside frontend container)
# For host-level Nginx see deploy/nginx/falcon.conf

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # API → backend (docker service name: backend)
    location /api/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /health/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # Django admin & API docs
    location ~ ^/(admin|api/docs|api/redoc|api/schema)/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # WebSockets
    location /ws/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/snippets/proxy-params.conf;
        include /etc/nginx/snippets/websocket.conf;
    }

    # Collected static / media (when served via backend)
    location /static/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /media/ {
        proxy_pass http://backend:8000;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # React SPA (Vite build in /usr/share/nginx/html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
