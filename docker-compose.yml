version: '3.8'

services:
  # --------------------------------------------------------------------------
  # Nginx Load Balancer
  # --------------------------------------------------------------------------
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: falcon-nginx-dev
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - falcon-static-vol:/app/staticfiles
      - falcon-media-vol:/app/media
    depends_on:
      - app-1
      - app-2
    networks:
      - falcon-net

  # --------------------------------------------------------------------------
  # Application Server Node 1
  # --------------------------------------------------------------------------
  app-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: falcon-app-1
    restart: unless-stopped
    volumes:
      - .:/workspaces/falcon-pms
      - falcon-static-vol:/workspaces/falcon-pms/staticfiles
      - falcon-media-vol:/workspaces/falcon-pms/media
    environment:
      - DJANGO_ENV=development
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DB_HOST=pgbouncer
      - DB_DIRECT_PORT=5432
      - DB_PORT=6432
      - DB_NAME=postgres
      - DB_USER=postgress
      - DB_PASSWORD=postgress
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - falcon-net

  # --------------------------------------------------------------------------
  # Application Server Node 2
  # --------------------------------------------------------------------------
  app-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: falcon-app-2
    restart: unless-stopped
    volumes:
      - .:/workspaces/falcon-pms
      - falcon-static-vol:/workspaces/falcon-pms/staticfiles
      - falcon-media-vol:/workspaces/falcon-pms/media
    environment:
      - DJANGO_ENV=development
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DB_HOST=pgbouncer
      - DB_DIRECT_PORT=5432
      - DB_PORT=6432
      - DB_NAME=postgres
      - DB_USER=postgress
      - DB_PASSWORD=postgress
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - falcon-net

  # --------------------------------------------------------------------------
  # Celery Background Task Worker
  # --------------------------------------------------------------------------
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: falcon-celery-worker-dev
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "--loglevel=info"]
    volumes:
      - .:/workspaces/falcon-pms
    environment:
      - DJANGO_ENV=development
      - DJANGO_SETTINGS_MODULE=config.settings.development
      - DB_HOST=pgbouncer
      - DB_DIRECT_PORT=5432
      - DB_PORT=6432
      - DB_NAME=postgres
      - DB_USER=postgress
      - DB_PASSWORD=postgress
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      - app-1
    networks:
      - falcon-net

  # --------------------------------------------------------------------------
  # PgBouncer Connection Multiplexer
  # --------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: falcon-pgbouncer-dev
    restart: unless-stopped
    ports:
      - "6432:6432"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgress
      - DB_PASSWORD=postgress
      - DB_NAME=postgres
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=10000
      - DEFAULT_POOL_SIZE=150
    volumes:
      - ./config/pgbouncer.docker.ini:/etc/pgbouncer/pgbouncer.ini
      - ./config/userlist.txt:/etc/pgbouncer/userlist.txt
    depends_on:
      db:
        condition: service_healthy
    networks:
      - falcon-net

  # --------------------------------------------------------------------------
  # PostgreSQL Primary Database Engine
  # --------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: falcon-postgres-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - falcon-postgres-data:/var/lib/postgresql/data
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./config/pg_hba.conf:/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgress
      POSTGRES_PASSWORD: postgress
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgress -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - falcon-net

  # --------------------------------------------------------------------------
  # Redis Cache Engine
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: falcon-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - falcon-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - falcon-net

volumes:
  falcon-postgres-data:
  falcon-redis-data:
  falcon-static-vol:
  falcon-media-vol:

networks:
  falcon-net:
    driver: bridge
