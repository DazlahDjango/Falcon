# Falcon PMS — staging (same as production with DJANGO_ENV=staging)
#   docker compose -f deploy/docker/docker-compose.staging.yml --env-file .env.staging up -d

name: falcon-pms-staging

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-falcon_pms_staging}
      POSTGRES_USER: ${DB_USER:-falcon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - postgres_staging:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-falcon}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_staging:/data

  backend:
    build:
      context: ../..
      dockerfile: Dockerfile.production
    restart: unless-stopped
    env_file:
      - ../../.env.staging
    environment:
      DJANGO_ENV: staging
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - '8000'

  celery-worker:
    build:
      context: ../..
      dockerfile: Dockerfile.production
    restart: unless-stopped
    command: celery -A config worker -l info --concurrency=2
    env_file:
      - ../../.env.staging
    environment:
      DJANGO_ENV: staging
    depends_on:
      - backend
      - redis

  celery-beat:
    build:
      context: ../..
      dockerfile: Dockerfile.production
    restart: unless-stopped
    command: celery -A config beat -l info
    env_file:
      - ../../.env.staging
    environment:
      DJANGO_ENV: staging
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${HTTP_PORT:-8080}:80'

volumes:
  postgres_staging:
  redis_staging:
