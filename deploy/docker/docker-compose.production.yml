# Falcon PMS — production stack
# Usage (from repo root):
#   cp deploy/env/.env.production.example .env.production
#   docker compose -f deploy/docker/docker-compose.production.yml --env-file .env.production up -d

name: falcon-pms

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-falcon_pms}
      POSTGRES_USER: ${DB_USER:-falcon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-falcon} -d ${DB_NAME:-falcon_pms}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../..
      dockerfile: Dockerfile.production
    restart: unless-stopped
    env_file:
      - ../../.env.production
    environment:
      DJANGO_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    expose:
      - '8000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:8000/health/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  celery-worker:
    build:
      context: ../..
      dockerfile: Dockerfile.production
    restart: unless-stopped
    command: celery -A config worker -l info --concurrency=4
    env_file:
      - ../../.env.production
    environment:
      DJANGO_ENV: production
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ../..
      dockerfile: Dockerfile.production
    restart: unless-stopped
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - ../../.env.production
    environment:
      DJANGO_ENV: production
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_WS_URL: ${VITE_WS_URL:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${HTTP_PORT:-80}:80'

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  logs_volume:
