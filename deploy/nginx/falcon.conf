# Falcon PMS — host Nginx (bare-metal / VM)
# Install:
#   sudo cp deploy/nginx/falcon.conf /etc/nginx/sites-available/falcon.conf
#   sudo cp -r deploy/nginx/snippets/* /etc/nginx/snippets/
#   sudo ln -sf /etc/nginx/sites-available/falcon.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Set FALCON_DOMAIN and upstream ports to match your install.

upstream falcon_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Redirect HTTP → HTTPS (uncomment when TLS is ready)
# server {
#     listen 80;
#     server_name app.example.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    # listen 443 ssl http2;
    server_name app.example.com;

    # ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    # include snippets/ssl-params.conf;

    root /var/www/falcon/dist;
    index index.html;

    access_log /var/log/nginx/falcon-access.log;
    error_log  /var/log/nginx/falcon-error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml;

    # Django API
    location /api/ {
        proxy_pass http://falcon_api;
        include snippets/proxy-params.conf;
    }

    location /health/ {
        proxy_pass http://falcon_api;
        include snippets/proxy-params.conf;
        access_log off;
    }

    location ~ ^/(admin|api/docs|api/redoc|api/schema)/ {
        proxy_pass http://falcon_api;
        include snippets/proxy-params.conf;
    }

    # WebSockets (dashboard, KPI, config progress, tenant status, etc.)
    location /ws/ {
        proxy_pass http://falcon_api;
        include snippets/proxy-params.conf;
        include snippets/websocket.conf;
    }

    # Collected Django static (run collectstatic to this path or proxy)
    location /static/ {
        alias /var/www/falcon/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /var/www/falcon/media/;
        expires 7d;
    }

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
