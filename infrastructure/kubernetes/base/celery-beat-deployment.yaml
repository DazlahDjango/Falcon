apiVersion: apps/v1
kind: Deployment
metadata:
  name: falcon-celery-beat
  namespace: falcon-pms
  labels:
    app.kubernetes.io/name: falcon-celery-beat
    app.kubernetes.io/component: scheduler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: falcon-celery-beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falcon-celery-beat
        app.kubernetes.io/component: scheduler
    spec:
      serviceAccountName: falcon-sa
      containers:
        - name: celery-beat
          image: falconpms/celery:latest
          imagePullPolicy: Always
          command: ["celery", "-A", "config", "beat", "-l", "INFO"]
          envFrom:
            - configMapRef:
                name: falcon-config
            - secretRef:
                name: falcon-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 400m
              memory: 512Mi
