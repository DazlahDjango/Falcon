apiVersion: apps/v1
kind: Deployment
metadata:
  name: falcon-celery-worker
  namespace: falcon-pms
  labels:
    app.kubernetes.io/name: falcon-celery-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: falcon-celery-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falcon-celery-worker
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: falcon-sa
      containers:
        - name: celery-worker
          image: falconpms/celery:latest
          imagePullPolicy: Always
          command: ["celery", "-A", "config", "worker", "-l", "INFO", "--concurrency=4"]
          envFrom:
            - configMapRef:
                name: falcon-config
            - secretRef:
                name: falcon-secrets
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 800m
              memory: 1024Mi
