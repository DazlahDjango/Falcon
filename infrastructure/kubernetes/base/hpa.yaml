apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: falcon-backend-hpa
  namespace: falcon-pms
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: falcon-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
