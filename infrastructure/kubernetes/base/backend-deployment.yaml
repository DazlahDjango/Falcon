apiVersion: apps/v1
kind: Deployment
metadata:
  name: falcon-backend
  namespace: falcon-pms
  labels:
    app.kubernetes.io/name: falcon-backend
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: falcon-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falcon-backend
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: falcon-sa
      containers:
        - name: backend
          image: falconpms/backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: falcon-config
            - secretRef:
                name: falcon-secrets
          env:
            - name: CONTAINER_ROLE
              value: "primary_web"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
