version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: falcon_postgres
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf
      - ../docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ../docker/postgres/init:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_DB: ${DB_NAME:-fasc_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Dazl2006}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-fasc_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - falcon_network

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: falcon_pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../docker/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ../docker/pgbouncer/entrypoint.sh:/entrypoint.sh:ro
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-Dazl2006}
      DB_NAME: ${DB_NAME:-fasc_db}
    networks:
      - falcon_network

  redis:
    image: redis:7-alpine
    container_name: falcon_redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ../docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - falcon_network

  backend:
    build:
      context: ../../
      dockerfile: infrastructure/docker/backend/Dockerfile
    container_name: falcon_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../../envs/base.env
      - ../../envs/database.env
      - ../../envs/auth.env
      - ../../envs/billing.env
      - ../../envs/configs.env
    environment:
      DB_HOST: pgbouncer
      DB_PORT: 6432
      REDIS_URL: redis://redis:6379/0
      CONTAINER_ROLE: primary_web
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    networks:
      - falcon_network

  celery_worker:
    build:
      context: ../../
      dockerfile: infrastructure/docker/celery/Dockerfile
    container_name: falcon_celery_worker
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    env_file:
      - ../../envs/base.env
      - ../../envs/database.env
      - ../../envs/auth.env
      - ../../envs/billing.env
      - ../../envs/configs.env
    environment:
      DB_HOST: pgbouncer
      DB_PORT: 6432
      REDIS_URL: redis://redis:6379/0
    command: celery -A config worker -l INFO --concurrency=4
    volumes:
      - media_volume:/app/media
      - logs_volume:/app/logs
    networks:
      - falcon_network

  celery_beat:
    build:
      context: ../../
      dockerfile: infrastructure/docker/celery/Dockerfile
    container_name: falcon_celery_beat
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    env_file:
      - ../../envs/base.env
      - ../../envs/database.env
      - ../../envs/auth.env
      - ../../envs/billing.env
      - ../../envs/configs.env
    environment:
      DB_HOST: pgbouncer
      DB_PORT: 6432
      REDIS_URL: redis://redis:6379/0
    command: celery -A config beat -l INFO
    volumes:
      - logs_volume:/app/logs
    networks:
      - falcon_network

  nginx:
    image: nginx:1.25-alpine
    container_name: falcon_nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ../docker/nginx/snippets:/etc/nginx/snippets:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    networks:
      - falcon_network

networks:
  falcon_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  logs_volume:
