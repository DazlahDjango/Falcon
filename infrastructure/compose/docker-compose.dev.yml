version: '3.8'

services:
  backend:
    build:
      context: ../../
      dockerfile: infrastructure/docker/backend/Dockerfile
    volumes:
      - ../../:/app
    environment:
      DJANGO_DEBUG: "True"
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"
