# Redis Production Configuration for Falcon PMS
bind 0.0.0.0
port 6379
protected-mode no

# Memory Management
maxmemory 512mb
maxmemory-policy volatile-lru

# Persistence
save 900 1
save 300 10
save 60 10000

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Slow Log
slowlog-log-slower-than 10000
slowlog-max-len 128
