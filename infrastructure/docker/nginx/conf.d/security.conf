# Global Security Rules for Nginx

# Block hidden files and dotfiles (.git, .env, etc.)
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

# Block common vulnerability scanning paths
location ~* \.(engine|inc|info|install|make|module|profile|test|po|sh|sql|theme|tpl(\.php)?|xtmpl)$ {
    deny all;
}

# Restrict body payload size to 25MB
client_max_body_size 25M;
client_body_buffer_size 128k;
