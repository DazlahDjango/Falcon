# Main Nginx application server configuration
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    include /etc/nginx/snippets/security-headers.conf;

    # Frontend React static build files
    root /usr/share/nginx/html;
    index index.html;

    # Health check endpoint
    location /health/ {
        proxy_pass http://falcon_backend;
        include /etc/nginx/snippets/proxy-params.conf;
        access_log off;
    }

    # Authentication API endpoints (rate limited)
    location /api/v1/accounts/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://falcon_backend;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # General REST API endpoints
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://falcon_backend;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # Django Admin and Schema/Swagger Docs
    location ~ ^/(admin|schema|docs|redoc)/ {
        proxy_pass http://falcon_backend;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    # WebSocket endpoints routed through ASGI
    location /ws/ {
        proxy_pass http://falcon_backend;
        include /etc/nginx/snippets/proxy-params.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 86400s;
    }

    # Collected static files
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Media uploads
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # React Single Page Application (SPA) routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
