apiVersion: apps/v1
kind: Deployment
metadata:
  name: falcon-frontend
  namespace: falcon-pms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: falcon-frontend
  template:
    metadata:
      labels:
        app: falcon-frontend
    spec:
      containers:
        - name: falcon-frontend
          image: falcon-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: falcon-frontend-service
  namespace: falcon-pms
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: falcon-frontend
  type: ClusterIP
