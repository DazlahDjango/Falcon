# Falcon PMS — Continuous Integration & Deployment
# CI: lint, Django check/migrate, frontend build, security scans
# CD: Docker push + SSH deploy (main/staging) when secrets are configured

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, staging]
    paths-ignore:
      - 'Docs/**'
      - 'docs/**'
      - '**/*.md'
      - '.github/**/*.md'
  pull_request:
    branches: [main, develop, staging]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  DJANGO_SETTINGS_MODULE: config.settings.test
  DB_NAME: test_db
  DB_USER: test_user
  DB_PASSWORD: test_pass
  DB_HOST: localhost
  DB_PORT: '5432'
  DJANGO_SECRET_KEY: ci-github-actions-secret
  CELERY_BROKER_URL: redis://localhost:6379/0
  CELERY_RESULT_BACKEND: redis://localhost:6379/0

jobs:
  # --------------------------------------------------------------------------
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/development.txt

      - name: Install Python dev dependencies
        run: pip install -r requirements/development.txt

      - name: Flake8 (apps)
        run: flake8 apps/ config/ manage.py --count --statistics --max-line-length=120 --extend-ignore=E501,W503 || true

      - name: isort check (apps)
        run: isort --check-only --diff apps/ config/ || true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

  # --------------------------------------------------------------------------
  backend:
    name: Backend — Django Check & Migrations
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/development.txt

      - name: Install dependencies
        run: pip install -r requirements/development.txt

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Django system check
        run: python manage.py check

      - name: Check migration plan
        run: python manage.py makemigrations --check --dry-run
        continue-on-error: true

  # --------------------------------------------------------------------------
  frontend-build:
    name: Frontend — Production Build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:8000/api/v1
          VITE_WS_URL: ws://localhost:8000/ws
        run: |
          npm ci
          npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # --------------------------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Bandit (Python)
        run: |
          pip install bandit
          bandit -r apps/ config/ -ll -f json -o bandit-report.json || true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (advisory)
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high --json > npm-audit-report.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            bandit-report.json
            frontend/npm-audit-report.json
          if-no-files-found: ignore

  # --------------------------------------------------------------------------
  docker:
    name: Docker Build (verify)
    runs-on: ubuntu-latest
    needs: [backend, frontend-build, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.production
          push: false
          tags: falcon-pms-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: falcon-pms-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------------------------
  deploy:
    name: Deploy (CD)
    runs-on: ubuntu-latest
    needs: [backend, frontend-build, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKER_USERNAME != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        if: ${{ secrets.DOCKER_USERNAME != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.production
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/falcon-pms-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/falcon-pms-backend:${{ github.sha }}

      - name: Build and push frontend
        if: ${{ secrets.DOCKER_USERNAME != '' }}
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/falcon-pms-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/falcon-pms-frontend:${{ github.sha }}

      - name: Deploy to staging
        if: github.ref == 'refs/heads/staging' && secrets.STAGING_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /opt/falcon-pms
            docker compose pull
            docker compose up -d --force-recreate
            docker compose exec -T backend python manage.py migrate --noinput
            docker system prune -f

      - name: Deploy to production
        if: github.ref == 'refs/heads/main' && secrets.PROD_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd /opt/falcon-pms
            docker compose pull
            docker compose up -d --force-recreate
            docker compose exec -T backend python manage.py migrate --noinput
            docker compose exec -T redis redis-cli FLUSHDB || true
            docker system prune -f

  # --------------------------------------------------------------------------
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy, backend, frontend-build]
    if: always() && github.event_name == 'push'
    steps:
      - name: Slack notification
        if: ${{ secrets.SLACK_WEBHOOK != '' }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_TITLE: Falcon PMS CI/CD
          SLACK_MESSAGE: |
            Repo: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Backend: ${{ needs.backend.result }}
            Frontend: ${{ needs.frontend-build.result }}
            Deploy: ${{ needs.deploy.result }}
          SLACK_COLOR: ${{ needs.backend.result == 'success' && needs.frontend-build.result == 'success' && 'good' || 'danger' }}
          MSG_MINIMAL: true
